[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bilingual-kb-starter"
version = "0.1.0"
description = "An English-first bilingual MkDocs template with terminology and a sensitive-content gate"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["mkdocs>=1.6,<2", "mkdocs-material>=9.6,<10", "mkdocs-static-i18n>=1.3,<2", "jieba>=0.42,<1", "PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.11,<1"]

[project.scripts]
kbtool = "bilingual_kb_starter.cli:main"

[project.entry-points."mkdocs.plugins"]
kb-gate = "bilingual_kb_starter.plugin:KnowledgePlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/bilingual_kb_starter"]

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
patch = ["subprocess"]
